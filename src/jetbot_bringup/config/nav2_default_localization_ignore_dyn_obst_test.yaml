
# https://docs.nav2.org/configuration/packages/configuring-bt-navigator.html
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: <robot_namespace>map
    robot_base_frame: <robot_namespace>base_footprint
    odom_topic: "diffbot_base_controller/odom"
    bt_loop_duration: 50
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_replanning_time.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_replanning_time.xml"
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# https://docs.nav2.org/configuration/packages/configuring-controller-server.html
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    use_realtime_priority: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 100.0

    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.10

    # DWB parameters
    FollowPath:
      plugin: "vector_pursuit_controller::VectorPursuitController"
      k: 2.5
      desired_linear_vel: 0.15
      min_turning_radius: 0.0 # Differential drive has 0 turning radius
      lookahead_dist: 0.1 # Increased to filter out small path irregularities (straighter driving)
      min_lookahead_dist: 0.05 # Reduced to allow approaching goal closer
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.25 # Slightly slower rotation for precision
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_linear_velocity: 0.0
      min_approach_linear_velocity: 0.02 # Drastically reduced to prevent stopping short
      approach_velocity_scaling_dist: 0.15
      max_allowed_time_to_collision_up_to_target: 3.0
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 10.0
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.08 # Reduced to ~3 deg to force alignment before moving

      max_angular_accel: 2.0
      max_linear_accel: 0.25
      max_lateral_accel: 0.2
      max_robot_pose_search_dist: 1.0
      use_interpolation: true
      use_heading_from_path: false # ОТКЛЮЧАЕМ следование за ломаными углами пути

      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# https://docs.nav2.org/configuration/packages/configuring-costmaps.html
# https://docs.nav2.org/plugins/index.html#costmap-layers
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      footprint_padding: 0.01
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: <robot_namespace>map
      robot_base_frame: <robot_namespace>base_footprint
      robot_radius: 0.085 # radius set and used, so no footprint points
      resolution: 0.02
      # plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugins: ["static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: "scan"
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
    
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 6.0
        inflation_radius: 0.09
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: <robot_namespace>odom
      robot_base_frame: <robot_namespace>base_footprint
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.02
      robot_radius: 0.085 # radius set and used, so no footprint points
      # plugins: ["inflation_layer, "voxel_layer"]
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.09 # Decreased to fit narrow corridor
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.02
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: "scan"
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.5
      always_send_full_costmap: True


# https://docs.nav2.org/configuration/packages/configuring-map-server.html#map-server-saver
map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: <robot_namespace>map 
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# https://docs.nav2.org/configuration/packages/configuring-planner-server.html
# https://docs.nav2.org/plugins/index.html#planners

# https://docs.nav2.org/configuration/packages/configuring-navfn.html
planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 3.0

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: <robot_namespace>odom
    robot_base_frame: <robot_namespace>base_footprint
    transform_timeout: 0.2
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

# https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# https://docs.nav2.org/configuration/packages/configuring-velocity-smoother.html
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    use_realtime_priority: True
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    max_velocity: [0.3, 0.0, 2.5]
    min_velocity: [-0.3, 0.0, -2.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "diffbot_base_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0



