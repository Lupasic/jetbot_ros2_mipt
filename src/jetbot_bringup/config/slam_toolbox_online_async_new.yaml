slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: DENSE_QR
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: Huber

    # ROS Parameters
    odom_frame: <robot_namespace>odom
    map_frame: <robot_namespace>map
    base_frame: <robot_namespace>base_footprint
    scan_topic: scan
    use_map_saver: true
    mode: mapping #mapping

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: 19.01.2026
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.1 #if 0 never publishes odometry
    map_update_interval: 1.5 # Increased time for Jetson Nano
    resolution: 0.02
    min_laser_range: 0.02 #for rastering images
    max_laser_range: 1.8 #for rastering images
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # 0.05 -> 0.10: sparser graph nodes — fewer near-identical scans smearing the walls,
    # each match covers more motion
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 60
    scan_buffer_maximum_scan_distance: 1.8
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    # 5.5 -> 2.0: maze is ~2.5 m across; searching loops map-wide invites false closures
    # between identical-looking parallel walls (perceptual aliasing)
    loop_search_maximum_distance: 2.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 15           
    loop_match_maximum_variance_coarse: 1.5 
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.65

    # Correlation Parameters - Correlation Parameters
    # 0.1 -> 0.3: +-10 cm search window was smaller than real odom drift between passes —
    # matcher could not reach the correct alignment and baked shifted (double) walls into
    # the graph. +-15 cm covers typical drift. Watch CPU load on the Nano.
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.005
    # 0.05 -> 0.03: less intentional blur during matching -> thinner, crisper walls
    correlation_search_space_smear_deviation: 0.03

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 0.5
    loop_search_space_resolution: 0.015
    loop_search_space_smear_deviation: 0.02

    # Scan Matcher Parameters
    angle_variance_penalty: 0.8
    distance_variance_penalty: 0.4   

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.7
    minimum_distance_penalty: 0.3
    use_response_expansion: true
    # 2 -> 3: a cell needs 3 hits to become a wall — filters single-ray outliers (speckle
    # dots outside the map)
    min_pass_through: 3
    occupancy_threshold: 0.1