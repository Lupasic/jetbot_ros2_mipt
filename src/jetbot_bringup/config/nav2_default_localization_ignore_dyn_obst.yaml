amcl:
  ros__parameters:
    use_sim_time: false

    alpha1: 0.05       # rotation noise from rotation
    alpha2: 0.01       # rotation noise from translation
    alpha3: 0.02       # translation noise from translation
    alpha4: 0.01       # translation noise from rotation
    alpha5: 0.01       # noise when rotating in place

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 1.0    # reduce since walls are nearby
    sigma_hit: 0.1                    # narrower hit distribution

    max_beams: 60                     # reduce for resource efficiency, keep only main beams
    laser_max_range: 3.0             # real maximum (if laser is 2-3m, this is enough)
    laser_min_range: 0.05            # sometimes useful to specify explicitly
    scan_topic: "scan"

    min_particles: 300
    max_particles: 800

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.2         # increase to react faster to new data

    update_min_d: 0.05               # every 5 cm
    update_min_a: 0.05               # every ~3 degrees

    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1

    pf_err: 0.02                     # required accuracy (smaller = more accurate)
    pf_z: 0.99                       # confidence probability (keep as is)

    transform_tolerance: 0.3         # react faster
    resample_interval: 1
    save_pose_rate: 1.0              # can be more frequent
    set_initial_pose: true
    tf_broadcast: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    base_frame_id: <robot_namespace>base_footprint
    odom_frame_id: <robot_namespace>odom
    global_frame_id: <robot_namespace>map